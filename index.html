<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <link rel="preconnect" href="https://docs.google.com" crossorigin>
  <link rel="dns-prefetch" href="https://docs.google.com">
  <title>Votar Rota</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Votar Rota">
  <meta name="description" content="Abre o formulário de rota já preenchido, pronto para enviar.">
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #22c55e;
      --accent-dark: #16a34a;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      padding-top: max(24px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      min-height: 100%;
      overscroll-behavior-y: contain;
    }
    main {
      width: 100%;
      max-width: 420px;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 4px;
      text-align: center;
    }
    p.sub {
      color: var(--muted);
      text-align: center;
      margin-bottom: 28px;
      font-size: 0.95rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    label {
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .campo { position: relative; }
    .limpar {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      padding: 0;
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
    }
    .limpar:hover { background: #0f1a2e; color: var(--text); }
    input {
      width: 100%;
      font-size: 1.6rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 18px 56px 18px 20px;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: #0b1220;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: var(--accent); }
    input::placeholder {
      color: #475569;
      font-weight: 600;
      text-transform: none;
    }
    button {
      width: 100%;
      font-size: 1.25rem;
      font-weight: 700;
      padding: 20px;
      border-radius: 14px;
      border: none;
      background: var(--accent);
      color: #04130a;
      cursor: pointer;
      transition: background 0.15s, transform 0.05s;
      -webkit-tap-highlight-color: transparent;
    }
    button:hover { background: var(--accent-dark); }
    button:active { transform: scale(0.98); }
    button:disabled {
      background: var(--border);
      color: var(--muted);
      cursor: not-allowed;
    }
    p.dica {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 16px;
      line-height: 1.4;
    }
    .votantes {
      display: flex;
      gap: 8px;
    }
    .votantes .chip { flex: 1; }
    .fila {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip {
      width: auto;
      font-size: 1rem;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 999px;
      border: 2px solid var(--border);
      background: #0b1220;
      color: var(--muted);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .chip.atual {
      border-color: var(--accent);
      color: var(--accent);
    }
    .chip.feita {
      opacity: 0.45;
      text-decoration: line-through;
    }
  </style>
</head>
<body>
  <main>
    <h1>🚗 Votar Rota</h1>
    <p class="sub">Abre o formulário preenchido pronto para enviar.</p>
    
    <form class="card" id="form" autocomplete="off">
      <div>
        <label for="rota">Rota</label>
        <div class="campo">
          <input
            id="rota"
            name="rota"
            type="text"
            inputmode="text"
            placeholder="ex.: v1 t2 r4"
            autocapitalize="characters"
            required
          >
          <button type="button" id="limpar" class="limpar" aria-label="Limpar rotas" hidden>✕</button>
        </div>
      </div>
      <div class="fila" id="fila" hidden></div>
      <div class="votantes" id="votantes">
        <button type="button" class="chip" data-votante="andreia">Andreia</button>
        <button type="button" class="chip" data-votante="weslley">Weslley</button>
      </div>
      <button type="submit" id="botao">Garantir Rota</button>
    </form>
    <p class="dica">Várias rotas separadas por espaço. Ao voltar, a próxima já está pronta — toque no chip pra corrigir a vez. Trocar de votante repete a lista inteira do começo.</p>
  </main>
  <script>
    // ---------- Formulário ----------
    // Notas do comportamento dele, verificadas no navegador em 01/08/2026:
    // - Coleta o e-mail pela conta Google logada e salva rascunho automático.
    // - Sem "srd=true" o rascunho vence o prefill: a query é descartada e abre o
    //   modal "Continuar o rascunho atual?". Com ele, a rota da URL entra direto —
    //   é o mesmo link que o botão "Continuar" do modal usa.
    // - A cópia por e-mail não dá pra automatizar: não tem "entry", o parâmetro
    //   "emailReceipt" é ignorado e nem script na página marca o checkbox.
    //   Por isso a âncora "#i4" para no título dessa pergunta, e não no Enviar.
    const FORM = "https://docs.google.com/forms/d/e/1FAIpQLSdgNe0ViWtpMASsPOIDwEE3yqnCuzoVEwQWUgI1-C3PCjM-nQ/viewform";
    const ANCORA = "#i4";

    const CAMPO = {
      id: "entry.901888441",
      rota: "entry.154777964",
      telefone: "entry.520656534",
    };

    const VOTANTES = {
      andreia: { id: "214677", telefone: "11941998086" },
      weslley: { id: "2115706", telefone: "11965391663" },
    };

    const MEMORIA = { rotas: "votar.rotas", vez: "votar.vez", votante: "votar.votante" };

    // ---------- Elementos ----------
    const form = document.getElementById("form");
    const input = document.getElementById("rota");
    const botao = document.getElementById("botao");
    const fila = document.getElementById("fila");
    const votantes = document.getElementById("votantes");
    const limpar = document.getElementById("limpar");

    // ---------- Estado ----------
    // "vez" é o índice da rota da vez; quando chega no tamanho da lista, a fila
    // acabou e o botão passa a oferecer repetir.
    let vez = 0;
    let votante = "andreia";

    function lembrar() {
      localStorage.setItem(MEMORIA.rotas, input.value.trim());
      localStorage.setItem(MEMORIA.vez, String(vez));
      localStorage.setItem(MEMORIA.votante, votante);
    }

    function relembrar() {
      input.value = localStorage.getItem(MEMORIA.rotas) || "";
      vez = parseInt(localStorage.getItem(MEMORIA.vez), 10) || 0;
      votante = localStorage.getItem(MEMORIA.votante) === "weslley" ? "weslley" : "andreia";
    }

    // ---------- Rotas ----------
    // "v1 t2, r4" -> ["v1", "t2", "r4"]. Vírgula e espaço servem de separador.
    function separarRotas(texto) {
      return texto.trim().split(/[\s,]+/).filter(Boolean);
    }

    function rotas() {
      return separarRotas(input.value);
    }

    // "t2" -> "T-2". Deixa passar o que não casar, pra não inventar rota.
    function normalizarRota(valor) {
      const limpo = valor.trim().toUpperCase();
      const partes = limpo.match(/^([A-Z]+)\D*(\d+)$/);
      return partes ? partes[1] + "-" + partes[2] : limpo;
    }

    function montarUrl(rota) {
      const pessoa = VOTANTES[votante];
      const query = new URLSearchParams({
        usp: "pp_url",
        [CAMPO.id]: pessoa.id,
        [CAMPO.telefone]: pessoa.telefone,
        [CAMPO.rota]: normalizarRota(rota),
        srd: "true",
      });
      return FORM + "?" + query + ANCORA;
    }

    // ---------- Desenho ----------
    function desenharFila(lista) {
      fila.hidden = lista.length < 2;
      fila.textContent = "";
      if (fila.hidden) return;

      lista.forEach(function (bruta, i) {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip" + (i < vez ? " feita" : i === vez ? " atual" : "");
        chip.textContent = normalizarRota(bruta);
        chip.addEventListener("click", function () {
          vez = i;
          lembrar();
          desenhar();
        });
        fila.appendChild(chip);
      });
    }

    function desenhar() {
      const lista = rotas();
      vez = Math.min(Math.max(vez, 0), lista.length);

      limpar.hidden = input.value.trim() === "";
      desenharFila(lista);

      votantes.querySelectorAll("[data-votante]").forEach(function (chip) {
        chip.classList.toggle("atual", chip.dataset.votante === votante);
      });

      const daVez = lista[vez];
      botao.textContent = daVez ? "Garantir " + normalizarRota(daVez)
        : lista.length ? "Repetir fila"
        : "Garantir Rota";
    }

    // ---------- Eventos ----------
    input.addEventListener("input", function () {
      vez = 0;
      lembrar();
      desenhar();
    });

    input.addEventListener("focus", function () {
      input.select();
    });

    limpar.addEventListener("click", function () {
      input.value = "";
      vez = 0;
      lembrar();
      desenhar();
      input.focus();
    });

    // Trocar de votante rebobina: o caso de uso é repetir a mesma lista pela
    // outra pessoa, então ninguém quer continuar do meio.
    votantes.querySelectorAll("[data-votante]").forEach(function (chip) {
      chip.addEventListener("click", function () {
        votante = chip.dataset.votante;
        vez = 0;
        lembrar();
        desenhar();
      });
    });

    form.addEventListener("submit", function (evento) {
      evento.preventDefault();

      const lista = rotas();
      if (!lista.length) { input.focus(); return; }

      // Fila terminada: o botão vira "repetir" e só rebobina, sem abrir nada.
      if (vez >= lista.length) {
        vez = 0;
        lembrar();
        desenhar();
        return;
      }

      const daVez = lista[vez];
      // Avança otimista: ao voltar, a próxima já está engatilhada. Se não chegou
      // a enviar, é só tocar no chip pra corrigir a vez.
      vez += 1;
      lembrar();

      botao.textContent = "ABRINDO...";
      window.location.href = montarUrl(daVez);
    });

    // pageshow cobre carga nova e volta via bfcache
    window.addEventListener("pageshow", function () {
      botao.disabled = false;
      relembrar();
      desenhar();
    });

    // PWA: registra o service worker (shell offline + instalável).
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
